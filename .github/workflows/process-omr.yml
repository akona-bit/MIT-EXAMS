name: Process Pending OMR
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call backend endpoint
        run: |
          curl -X POST "https://mit-exams-api.onrender.com/api/v1/internal/process-pending-omr" \
            -H "X-Internal-Token: ${{ secrets.INTERNAL_TASK_TOKEN }}" \
            --fail --max-time 120
