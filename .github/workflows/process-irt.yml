name: Process Pending IRT
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call backend endpoint
        run: |
          curl -X POST "https://mit-exams-api.onrender.com/api/v1/internal/process-pending-irt" \
            -H "X-Internal-Token: ${{ secrets.INTERNAL_TASK_TOKEN }}" \
            --fail --max-time 120
